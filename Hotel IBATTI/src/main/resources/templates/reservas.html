<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservas | Hotel IBATTI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Hotel IBATTI</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/}">Volver al inicio</a>
        </div>
    </nav>

    <main class="container py-4">
        <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <h1 class="h2 mb-0">Reservas</h1>
            <a class="btn btn-primary" th:href="@{/reservas/nueva}">Nueva reserva</a>
        </header>

        <p class="alert alert-success" role="status"
           th:if="${mensaje != null}" th:text="${mensaje}"></p>

        <form class="card card-body mb-4" method="get" th:action="@{/reservas}">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-sm-5 col-lg-3">
                    <label class="form-label" for="habitacion">Número de habitación</label>
                    <input class="form-control" id="habitacion" name="habitacion"
                           type="search" th:value="${habitacion}" placeholder="Ej.: 901">
                </div>
                <div class="col-auto d-flex flex-wrap gap-2">
                    <button class="btn btn-primary" type="submit">Filtrar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/reservas}">Limpiar filtro</a>
                </div>
            </div>
        </form>

        <p class="alert alert-info" th:if="${reservas.isEmpty()}"
           th:text="${#strings.isEmpty(habitacion)
               ? 'Todavía no hay reservas registradas.'
               : 'No hay reservas para esa habitación.'}"></p>

        <div class="card" th:unless="${reservas.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0"
                       aria-label="Listado de reservas">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Huésped</th>
                            <th scope="col">Habitación</th>
                            <th scope="col">Ingreso</th>
                            <th scope="col">Salida</th>
                            <th scope="col" class="text-end">Total ($)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reserva : ${reservas}">
                            <td th:text="${reserva.id()}"></td>
                            <td th:text="${reserva.huesped()}"></td>
                            <td th:text="${reserva.habitacion()}"></td>
                            <td class="text-nowrap" th:text="${reserva.ingreso()}"></td>
                            <td class="text-nowrap" th:text="${reserva.salida()}"></td>
                            <td class="text-end" th:text="${reserva.total()}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
