<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservas | Hotel IBATTI</title>
</head>
<body>

    <h1>Reservas de Hotel IBATTI</h1>

    <p><a th:href="@{/reservas/nueva}">Nueva reserva</a></p>
    <p><a th:href="@{/}">Volver al inicio</a></p>

    <!-- Formulario de filtro por habitación -->
    <form method="get" th:action="@{/reservas}">
        <label for="nroHabitacion">Número de habitación:</label>
        <input type="text" id="nroHabitacion" name="nroHabitacion" placeholder="Ej.: 901">
        <button type="submit">Filtrar</button>
        <a th:href="@{/reservas}">Limpiar filtro</a>
    </form>

    <p role="status" th:if="${mensaje != null}" th:text="${mensaje}"></p>
    <p th:if="${reservas.isEmpty()}">Todavía no hay reservas registradas.</p>

    <table th:unless="${reservas.isEmpty()}">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Huésped</th>
                <th scope="col">Habitación</th>
                <th scope="col">Ingreso</th>
                <th scope="col">Salida</th>
                <th scope="col">Total</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="reserva : ${reservas}">
                <td th:text="${reserva.id}"></td>
                <td th:text="${reserva.huesped}"></td>
                <td th:text="${reserva.habitacion}"></td>
                <td th:text="${reserva.ingreso}"></td>
                <td th:text="${reserva.salida}"></td>
                <td th:text="${reserva.total}"></td>
                <td>
                    <a th:href="@{|/reservas/${reserva.id}/editar|}">Editar</a>
                    <form method="post" 
                          th:action="@{|/reservas/${reserva.id}/eliminar|}" 
                            onsubmit="return confirm('¿Querés eliminar esta reserva?')" 
                            style="display:inline;">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
